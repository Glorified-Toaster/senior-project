services:
  db:
    image: postgres:17-alpine
    container_name: uot-exam-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-testuser}
      POSTGRES_PASSWORD: ${DB_PASS:-123456}
      POSTGRES_DB: ${DB_NAME:-testdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-testuser} -d ${DB_NAME:-testdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uot-exam-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8443:8443"
    volumes:
      - ./config/config.docker.yaml:/app/config/config.yaml:ro
      - ./certs:/app/certs:ro
      - app-uploads:/app/web/static/uploads
      - app-logs:/app/logs
    environment:
      GIN_MODE: release

volumes:
  pgdata:
  app-uploads:
  app-logs:
