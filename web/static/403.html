<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <script src="/src/particles.min.js"></script>
</head>

<body class="h-full w-full antialiased bg-background text-foreground overflow-hidden font-sans">
    <div id="particles-js" class="fixed inset-0 -z-10 pointer-events-none"></div>

    <div class="fixed inset-0 flex items-center justify-center p-4 z-10 pointer-events-none">
        <div class="w-full max-w-sm pointer-events-auto">
            <div class="w-full rounded-lg border bg-card text-card-foreground shadow-xs">
                <div class="flex flex-col space-y-1.5 p-6 pb-6 text-center items-center gap-1">
                    <h3 class="text-3xl font-semibold leading-none tracking-tight">403</h3>
                    <p class="text-sm text-muted-foreground">Access Denied</p>
                </div>
                <div class="p-6 pt-0 text-center">
                    <p class="text-sm text-muted-foreground">
                        You do not have permission to access this resource. Please contact your administrator if you believe this is an error.
                    </p>
                </div>
                <div class="flex items-center p-6 pt-0 justify-center gap-3">
                    <a href="/" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:opacity-50 disabled:pointer-events-none ring-offset-background bg-primary text-primary-foreground hover:bg-primary/90 h-10 py-2 px-4 w-full">
                        Return Home
                    </a>
                    <button onclick="window.history.back()" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:opacity-50 disabled:pointer-events-none ring-offset-background border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 py-2 px-4 w-full">
                        Go Back
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
      particlesJS('particles-js', {
        "particles": {
          "number": {
            "value": 70,
            "density": {
              "enable": true,
              "value_area": 800
            }
          },
          "color": {
            "value": "#000000"
          },
          "shape": {
            "type": "circle",
            "stroke": {
              "width": 0,
              "color": "#000000"
            }
          },
          "opacity": {
            "value": 0.5,
            "random": false
          },
          "size": {
            "value": 3,
            "random": true
          },
          "line_linked": {
            "enable": true,
            "distance": 150,
            "color": "#76BCE4",
            "opacity": 0.4,
            "width": 1
          },
          "move": {
            "enable": true,
            "speed": 3,
            "direction": "none",
            "random": true,
            "straight": false,
            "out_mode": "out",
            "bounce": true
          }
        },
        "interactivity": {
          "detect_on": "window",
          "events": {
            "onhover": {
              "enable": true,
              "mode": "repulse"
            },
            "onclick": {
              "enable": true,
              "mode": "remove"
            },
            "resize": true
          },
          "modes": {
            "repulse": {
              "distance": 120,
              "duration": 0.4
            }
          }
        },
        "retina_detect": true
      });
    </script>
</body>
</html>
